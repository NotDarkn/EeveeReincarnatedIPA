name: Feature Request
description: Suggest an idea or improvement for EeveeSpotify
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Read this first — what you can't request:**

        These features are **server-sided** and will **never** work, with or without Premium emulation. Requests for them will be **closed immediately**:
        - Very High audio quality
        - Native playlist/track downloading (podcast episodes and local playlists over Wi-Fi are the only exceptions)
        - Hosting a Spotify Jam (joining in-person is fine)
        - AI DJ / AI Playlist
        - Spotify Connect playback (server-side streaming; the device acts only as a remote)
        - Anything that requires actually having a Premium subscription on Spotify's servers

        Also not accepted:
        - **Free feature requests in general.** EeveeSpotify is maintained by volunteers. If you need something, feel free to implement it yourself and submit a pull request — or open an issue to discuss paid opportunities.
        - "Make it work on Android / Windows / etc." — iOS/iPadOS only by design.

  - type: checkboxes
    id: rules-check
    attributes:
      label: Pre-submit checks
      options:
        - label: My request is NOT one of the server-sided features listed above
        - label: I understand free feature requests are not guaranteed and that PRs are welcome
        - label: I have checked that a similar request doesn't already exist (open or closed)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what's missing or annoying about it today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Be concrete about the behavior you expect.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've tried
      description: Other tweaks, settings, or steps you've already tried.

  - type: dropdown
    id: contribution
    attributes:
      label: Can you help build it?
      description: 'Select "Yes" if you''re open to submitting a pull request or testing builds.'
      options:
        - "No, I'm just suggesting"
        - "I can test and give feedback"
        - "Yes, I can write the code / open a PR"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, mockups, or links to related issues.
