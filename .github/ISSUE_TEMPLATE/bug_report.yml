name: Bug Report
description: Report something that doesn't work as expected in EeveeSpotify
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you submit:**
        - Check the [Common Issues / FAQ](https://github.com/jaydenjcpy/EeveeSpotifyReincarnated/blob/Master/common_issues.md) — most premium, logout, lyrics, and download questions are answered there.
        - Issues about server-sided features (Very High audio quality, native playlist downloading, Jam hosting, AI DJ/Playlist, Spotify Connect, homescreen/podcast ads) will be closed without further discussion.
        - If you can, update to the latest EeveeSpotify and Spotify versions and check whether the bug still happens.

  - type: dropdown
    id: install-type
    attributes:
      label: Installation type
      options:
        - Jailbroken (deb)
        - TrollStore
        - Sideloaded IPA (SideStore / AltStore / Sideloadly / signing service)
        - Other
    validations:
      required: true

  - type: input
    id: spotify-version
    attributes:
      label: Spotify version
      description: Found in Spotify > Settings > About, e.g. 9.1.74
      placeholder: e.g. 9.1.74
    validations:
      required: true

  - type: input
    id: eevee-version
    attributes:
      label: EeveeSpotify version
      description: Found in EeveeSpotify settings, e.g. 5.x.x
      placeholder: e.g. 5.1.0
    validations:
      required: true

  - type: input
    id: ios-version
    attributes:
      label: iOS / iPadOS version
      placeholder: e.g. iOS 18.2, iPhone 13
    validations:
      required: true

  - type: checkboxes
    id: faq-check
    attributes:
      label: Pre-submit checks
      options:
        - label: I have read the [Common Issues / FAQ](https://github.com/jaydenjcpy/EeveeSpotifyReincarnated/blob/Master/common_issues.md)
        - label: This is not a server-sided feature listed in the FAQ or README
        - label: I am on the latest EeveeSpotify release (or this also happens on it)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Be as specific as you can, e.g. "1. Open the lyrics view on any track, 2. ..."
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: feature-area
    attributes:
      label: Affected area
      options:
        - Premium patching / playback
        - Lyrics
        - Downloads (podcasts / local playlists only)
        - Settings UI
        - Ads
        - Login / session
        - CarPlay / Siri / lock screen
        - Build or installation
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: |
        Export the debug log from EeveeSpotify settings and paste it below.
        Remove any tokens or account details if present.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or screen recordings welcome. Please don't include your account email.
