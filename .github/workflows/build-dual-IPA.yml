name: Create EeveePrebuilts (DUAL)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        default: "Master"
        required: true
        type: string 
      ipa_url:
        description: "URL to a decrypted Spotify IPA"
        required: false
        type: string
      github_release:
        description: "Create a GitHub Release?"
        default: true
        required: true
        type: boolean

env:
  SWIFTPROTOBUF_VERSION: "1.29.0"
  XCODE_VERSION: "latest-stable"

jobs:
  build-deb:
    strategy:
      matrix:
        include:
          - scheme: rootless
            label: rootless
            theos_repository: theos/theos
          - scheme: roothide
            label: roothide
            theos_repository: roothide/theos
    runs-on: macos-latest
    outputs:
      COMMIT_ID: ${{ steps.SETUP_COMMIT_ID.outputs.COMMIT_ID }}
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}
    steps:
      - name: Checkout EeveePrebuilt
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive

        # this grabs the latest commit ID from SideloadLabs's EeveeSpotifyReincarnated repo 
        # then it's cut down to the first 7 characters for the shortened commit ID that is used for naming files
      - name: Setup Commit ID
        id: SETUP_COMMIT_ID
        run: |
          COMMIT_FULL=$(git ls-remote https://github.com/SideloadLabs/EeveeSpotifyReincarnated.git ${{ inputs.branch }} | cut -f1)
          COMMIT=${COMMIT_FULL:0:7}
          echo "COMMIT_ID=$COMMIT" >> $GITHUB_OUTPUT
          echo "COMMIT_ENV=$COMMIT" >> $GITHUB_ENV
          echo "THEOS_SCHEME=$THEOS_PACKAGE_SCHEME" >> $GITHUB_ENV

      - name: Cache EeveeSpotify deb
        id: deb-eevee-cache
        uses: actions/cache@v5
        with:
          path: "packages/com.eevee.spotify_${{ env.COMMIT_ENV }}-${{ env.THEOS_SCHEME }}.deb"
          key: deb-${{ env.COMMIT_ENV }}-${{ env.THEOS_SCHEME }}-cache

      - name: Setup Xcode
        if: steps.deb-eevee-cache.outputs.cache-hit != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

        # saves roughly 5 to 8 seconds when caching theos :)
      - name: Cache Theos
        if: steps.deb-eevee-cache.outputs.cache-hit != 'true'
        id: deb-theos-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/theos
          key: theos-cache-${{ env.XCODE_VERSION }}-${{ matrix.label }}

      - name: Setup ${{ matrix.label }} Theos
        if: steps.deb-eevee-cache.outputs.cache-hit != 'true' && steps.deb-theos-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.theos_repository }}
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install deb build tools
        if: steps.deb-eevee-cache.outputs.cache-hit != 'true'
        run: |
          brew trust aws/tap azure/bicep
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Grab EeveeSwiftProtobuf.framework latest commit ID
        if: steps.deb-eevee-cache.outputs.cache-hit != 'true'
        run: |
          PROTOBUF_COMMIT=$(git log -1 --format="%h" -- Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh)
          echo "PROTOBUF_COMMIT_ID=$PROTOBUF_COMMIT" >> $GITHUB_ENV

      - name: Grab EeveeSwiftProtobuf.framework from cache
        if: steps.deb-eevee-cache.outputs.cache-hit != 'true'
        id: protobuf-cache
        uses: actions/cache@v5
        with:
          # /Users/runner/work/EeveePrebuilt/EeveePrebuilt/theos/lib/iphone/rootless/EeveeSwiftProtobuf.framework
          # env.THEOS is /Users/runner/work/EeveePrebuilt/EeveePrebuilt/theos
          # the rest of the path is just where EeveeSwiftProtobuf.framework is.
          path: ${{ env.THEOS }}/lib/iphone/${{ env.THEOS_SCHEME }}/EeveeSwiftProtobuf.framework
          # this should end up being like "eeveeswiftprotobuf-1.29.0"
          key: eeveeswiftprotobuf-${{ env.PROTOBUF_COMMIT_ID }}-${{ env.THEOS_SCHEME }}-cache

        # hopefully, this should only run if the above step (cache) doesn't exist
      - name: Build EeveeSwiftProtobuf.framework from source
        if: steps.deb-eevee-cache.outputs.cache-hit != 'true' && steps.protobuf-cache.outputs.cache-hit != 'true'
        env:
          SWIFTPROTOBUF_VERSION: ${{ env.SWIFTPROTOBUF_VERSION }}
        run: make build-eeveeswiftprotobuf

        # this should save another like 10 to 15s as it'll already have Swift Support Tools built
      - name: Grab Swift Support Tools from cache
        id: swift-cache
        if: steps.deb-eevee-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.THEOS }}/vendor/swift-support/.theos_build
            ${{ env.THEOS }}/vendor/swift-support/.build
          key: swift_tools-cache-${{ env.XCODE_VERSION }}
        
        # if this works, it should save roughly 3 to 4 minutes for future workflow runs
      - name: Grab Orion Preprocessor from cache
        id: orion-cache
        if: steps.deb-eevee-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.THEOS }}/vendor/orion/.theos_build
            ${{ env.THEOS }}/vendor/orion/.build
          key: orion_build-cache-${{ env.XCODE_VERSION }}

      - name: Build .deb (${{ matrix.label }})
        if: steps.deb-eevee-cache.outputs.cache-hit != 'true'
        run: THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} make package FINALPACKAGE=1
      
      - name: Find .deb artifact
        run: |
          DEB_PATH=$(find packages -name "com.eevee.spotify_*.deb" | head -1)
          [ -n "$DEB_PATH" ] || { echo "deb not produced" >&2; exit 1; }
          DEB_RENAME="packages/com.eevee.spotify_${COMMIT_ENV}-${THEOS_SCHEME}.deb"
          mv "$DEB_PATH" "$DEB_RENAME"
          echo "DEB_PATH=$DEB_RENAME" >> $GITHUB_ENV
          echo "DEB_NAME=$(basename "$DEB_RENAME")" >> $GITHUB_ENV

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: com.eevee.spotify_${{ env.COMMIT_ENV }}-${{ env.THEOS_SCHEME }}
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error

  build-ipa:
    needs: build-deb
    runs-on: macos-latest
    strategy:
      matrix:
        variant:
          - Unpatched
          - Patched
    outputs:
      SPOTIFY_VERSION: ${{ steps.SPOTIFY_VERSION.outputs.SPOT_VERSION }}
    env:
      COMMIT_ID: ${{ needs.build-deb.outputs.commit_id }}
      THEOS: ${{ github.workspace }}/theos
    if: ${{ inputs.ipa_url != '' }}
    steps:
      - name: Checkout EeveePrebuilt
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive

      - name: (PATCHED) Cache Theos
        if: matrix.variant == 'Patched'
        id: ipa-theos-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/theos
          key: theos-cache-${{ env.XCODE_VERSION }}-rootless

      - name: (PATCHED) Setup Theos
        uses: actions/checkout@v7
        if: matrix.variant == 'Patched' && steps.ipa-theos-cache.outputs.cache-hit != 'true'
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: (UNPATCHED) Install IPA tools
        if: matrix.variant == 'Unpatched'
        run: |
          brew trust aws/tap azure/bicep
          brew install dpkg
          python3 -m pip install --upgrade --break-system-packages \
              git+https://github.com/asdfzxcvbn/pyzule-rw.git
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && SUFFIX=macos-amd64 || SUFFIX=macos-arm64

      - name: (PATCHED) Install IPA tools
        if: matrix.variant == 'Patched'
        run: |
          brew trust aws/tap azure/bicep
          brew install dpkg ldid
          python3 -m pip install --upgrade --break-system-packages \
              git+https://github.com/asdfzxcvbn/pyzule-rw.git
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && SUFFIX=macos-amd64 || SUFFIX=macos-arm64
          sudo curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" \
              -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch

      - name: Mask decrypted .ipa URL
        uses: levibostian/action-hide-sensitive-inputs@v1 
        
      - name: Download .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: com.eevee.spotify_${{ env.COMMIT_ID }}-rootless
          path: deb
      
      - name: Download decrypted .ipa
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O ${{ github.workspace }}/spotify.ipa
          file_type=$(file --mime-type -b ${{ github.workspace }}/spotify.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Not a valid IPA: $file_type"
            exit 1
          fi

      - name: Download OpenSpotifySafariExtension.appex
        run: |
          EXT_DIR="$RUNNER_TEMP/OpenSpotifySafariExtension"
          rm -rf "$EXT_DIR"
          git clone --depth 1 https://github.com/BillyCurtis/OpenSpotifySafariExtension.git "$EXT_DIR"
          EXT_SRC="$EXT_DIR/OpenSpotifySafariExtension.appex"
          [ -e "$EXT_SRC" ] || { echo "OpenSpotifySafariExtension.appex not found in repo" >&2; exit 1; }
          echo "OPENSPOTIFY_APPEX=$EXT_SRC" >> $GITHUB_ENV

      - name: Identify Spotify version from IPA
        id: SPOTIFY_VERSION
        run: |
          VERSION=$(unzip -p ${{ github.workspace }}/spotify.ipa 'Payload/Spotify.app/Info.plist' \
            | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || echo "unknown")
          echo "SPOT_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "SPOT_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Inject deb + framework into IPA (cyan)
        run: |
          mkdir -p Outputs/IPAS
          DEB_EXTRACT="$RUNNER_TEMP/deb-extract"
          mkdir -p "$DEB_EXTRACT"
          DEB_PATH=$(find deb -name "*.deb" | head -1)
          dpkg-deb -R "$DEB_PATH" "$DEB_EXTRACT"

          DYLIB_SRC=$(find "$DEB_EXTRACT" -name 'EeveeSpotify.dylib' | head -1)
          BUNDLE_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)

          OUT="Outputs/IPAS/EeveePrebuilt-${{ matrix.variant }}-${COMMIT_ID}-${SPOT_VERSION}.ipa"

          INJECT=("$DYLIB_SRC")
          [ -n "$FRAMEWORK_SRC" ] && INJECT+=("$FRAMEWORK_SRC")
          [ -n "$BUNDLE_SRC" ]    && INJECT+=("$BUNDLE_SRC")

          # -d enable documents, -u drop UISupportedDevices, -m floor MinOS,
          # -c max compress. Watch + native appex strip happens in the next
          # step via Tools/strip-ipa.sh.
          cyan -i ${{ github.workspace }}/spotify.ipa -o "$OUT" \
               -f "${INJECT[@]}" -c 1 -m 15.0 -du
          echo "OUT_IPA=$OUT" >> $GITHUB_ENV

      - name: (PATCHED) Grab zxPluginsInject.dylib latest commit ID
        if: matrix.variant == 'Patched'
        run: |
          zxPluginsInject_COMMIT=$(git log -1 --format="%h" -- Tools/build-zxpi.sh)
          echo "zxPluginsInject_COMMIT_ID=$zxPluginsInject_COMMIT" >> $GITHUB_ENV

      - name: (PATCHED) Grab zxPluginsInject.dylib from cache
        if: matrix.variant == 'Patched'
        id: zxPluginsInject-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/packages/zxPluginsInject.dylib
          key: zxPluginsInject-${{ env.zxPluginsInject_COMMIT_ID }}-cache
          
      - name: (PATCHED) Build zxPluginsInject.dylib from source
        if: matrix.variant == 'Patched' && steps.zxPluginsInject-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x Tools/build-zxpi.sh
          Tools/build-zxpi.sh

      - name: (PATCHED) LC-inject zxPluginsInject
        if: matrix.variant == 'Patched'
        run: |
          ipapatch --input "$OUT_IPA" --inplace --noconfirm \
                   --dylib packages/zxPluginsInject.dylib

      - name: (UNPATCHED) Strip incompatible bundles
        if: matrix.variant == 'Unpatched'
        run: |
          chmod +x Tools/strip-ipa-modified.sh
          Tools/strip-ipa-modified.sh "$OUT_IPA"

        # a friend on mine Discord offered to improve these two steps significantly
        # and when i heard "help" i interpreted it as "i'll help" and not "claude'll help", but hey it worked ig
      - name: Add Safari Extension & Strip Watch leftovers
        run: |
          IPA_NAME="$(basename "$OUT_IPA")"
          cd "$(dirname "$OUT_IPA")"
          
          zip -d "$IPA_NAME" \
            "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex/*" \
            "Payload/Spotify.app/Watch/*" \
            "Payload/Spotify.app/com.apple.WatchPlaceholder/*" \
            "Payload/Spotify.app/WatchKit*" \
            "Payload/WatchKitSupport/*" \
            >/dev/null 2>&1 || true
          
          STAGE="$RUNNER_TEMP/appex_stage"
          mkdir -p "$STAGE/Payload/Spotify.app/PlugIns"
          cp -R "$OPENSPOTIFY_APPEX" "$STAGE/Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"
          
          cd "$STAGE"
          zip -qry "$OLDPWD/$IPA_NAME" "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"
          
      - name: Stage alternate app icons
        run: |
          chmod +x Tools/alt-icons-modified.sh
          Tools/alt-icons-modified.sh "$OUT_IPA"

        # basename to grab the file name of {OUT_IPA}, then %.ipa to strip the filename from .ipa, then add -spoti.pw.ipa at the end.
      - name: Generate spoti.pw flag table from IPA
        if: ${{ inputs.ipa_url != '' }}
        run: |
          OUT_SPOTIPW="$RUNNER_TEMP/$(basename "${OUT_IPA%.ipa}")-spoti.pw.ipa"
          cp "$OUT_IPA" "$OUT_SPOTIPW"
          python3 Sources/EeveeSpotifyC/SubRepos/spoti.pw/scripts/extract-flags.py "$OUT_SPOTIPW"

      - name: Upload Regular IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: EeveePrebuilt-${{ matrix.variant }}
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error

      - name: Upload spoti.pw IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: EeveePrebuilt-${{ matrix.variant }}
          path: ${{ env.OUT_SPOTIPW }}
          if-no-files-found: error        

  github-release:
    needs: [build-ipa, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SPOT_VERSION: ${{ needs.build-ipa.outputs.spotify_version }}
      COMMIT_ID: ${{ needs.build-deb.outputs.commit_id }}
    steps:
      - name: Checkout (for tags)
        if: ${{ inputs.github_release == true }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download rootless .deb
        if: ${{ inputs.github_release == true }}
        uses: actions/download-artifact@v8
        with:
          name: com.eevee.spotify_${{ env.COMMIT_ID }}-rootless
          path: release_files/deb

      - name: Download roothide .deb
        if: ${{ inputs.github_release == true }}
        uses: actions/download-artifact@v8
        with:
          name: com.eevee.spotify_${{ env.COMMIT_ID }}-roothide
          path: release_files/deb

      - name: Download unpatched IPAs
        if: ${{ inputs.github_release == true }}
        uses: actions/download-artifact@v8
        with:
          name: EeveePrebuilt-Unpatched
          path: release_files/unpatched

      - name: Download patched IPAs
        if: ${{ inputs.github_release == true }}
        uses: actions/download-artifact@v8
        with:
          name: EeveePrebuilt-Patched
          path: release_files/patched

      - name: Get previous tag (for description)
        if: ${{ inputs.github_release == true }}
        run: |
          git fetch --tags
          PREV_TAG=$(git tag --sort=-creatordate | head -n 1)
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: ${{ inputs.github_release == true }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ env.SPOT_VERSION }}-${{ env.COMMIT_ID }}"
          name: "${{ env.SPOT_VERSION }} // ${{ env.COMMIT_ID }}"
          body: |
            # EeveePrebuilt // [${{ env.SPOT_VERSION }}-${{ env.COMMIT_ID }}](https://github.com/NotDarkn/EeveePrebuilt/releases/tag/${{ env.SPOT_VERSION }}-${{ env.COMMIT_ID }})
            This version pulls the latest changes made up to the commit [`${{ env.COMMIT_ID }}`](https://github.com/SideloadLabs/EeveeSpotifyReincarnated/commit/${{ env.COMMIT_ID }}) in the [EeveeSpotifyReincarnated](https://github.com/SideloadLabs/EeveeSpotifyReincarnated) repo. 

            ## Changelogs (vs. [${{ env.PREV_TAG }}](https://github.com/NotDarkn/EeveePrebuilt/releases/tag/${{ env.PREV_TAG }}))

            ## Unpatched vs. Patched
            Unpatched → Use if you're using a **Free Developer Account** to sideload. (e.g. [Sideloadly](https://sideloadly.io) / [PlumeImpactor](https://github.com/claration/Impactor))

            Patched → Use if you're using **TrollStore** or a **Paid Developer Certificate** to sideload.

            ## Credits
            @SideloadLabs - [EeveeSpotifyReincarnated](https://github.com/SideloadLabs/EeveeSpotifyReincarnated)
            @whoeevee - [EeveeSpotify](https://github.com/whoeevee/EeveeSpotifyReborn)
            @estrogencat - [EeveeIPA](https://github.com/estrogencat/EeveeIPA)

            > [!NOTE]
            > The `com.eevee.spotify-rootless.deb` & `com.eevee.spotify-roothide.deb` are for people who're on jailbroken devices.
          draft: true
          prerelease: false
          files: |
            release_files/**/*.ipa
            release_files/**/*.deb

      - name: Cleanup Artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
              EeveePrebuilt-*
              com.eevee.spotify_*